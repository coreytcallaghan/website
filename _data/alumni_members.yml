- name: Marina Marquis
  position: Master's student
  description: Marina received a Master's from the Department of Wildlife Ecology and Conservation. Marine combined iNaturalist data to understand macroecological phenology changes in pollinators with fieldwork to quantify local plant-pollinator interactions in urban South Florida. She is currently a PhD student at UMASS Boston.
