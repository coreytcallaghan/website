- name: Jackson Barratt Heitmann
  position: PhD Student
  description: Jackson graduated in August 2026 with a PhD from the Department of Wildlife Ecology and Conservation. He studied wetland biodiversity, using a combination of data analysis and fieldwork, to understand the value and importance of various types of wetlands, ranging from natural ephemeral wetlands to highly anthropogenic constructed wetlands. 
  image: /images/teampic/jackson_barratt_heitmann_headshot.jpg
